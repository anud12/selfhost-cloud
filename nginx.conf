server {
    listen 80;
    server_name localhost;

    # Use auth_request module to validate session with auth server
    location / {
        auth_request /internal-auth;
        return 200 '<html><body><h1>Welcome Home!</h1><p>You are authenticated.</p></body></html>';
        add_header Content-Type text/html;
    }

    location = /internal-auth {
        internal;
        proxy_pass http://auth:3000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Redirect unauthorized users to sign-in page
    error_page 401 = @signin;
    location @signin {
        return 302 http://localhost/auth/;
    }

    location /auth/ {
        proxy_pass http://auth:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
