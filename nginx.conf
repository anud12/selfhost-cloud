# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name anud.ro www.anud.ro;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name anud.ro www.anud.ro;

    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    # Token verification subrequest handler (used by auth_request on /private/).
    # The OAuth2 provider answers 200 when the request carries a valid access
    # token (Bearer header or the demo session cookie) and 401 otherwise.
    # `internal` so it is only reachable via the auth_request subrequest.
    location = /oauth/verify {
        internal;
        proxy_pass http://auth:3000/oauth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth2 provider endpoints (authorize, token, introspect, userinfo).
    location /oauth/ {
        proxy_pass http://auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI specification. Gated at the edge like the other protected paths.
    location = /openapi.json {
        auth_request /oauth/verify;
        error_page 401 = @login;
        error_page 403 = @login;

        proxy_pass http://auth:3000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth2 client flow steps that must be reachable WITHOUT a valid token.
    location = /private/login {
        proxy_pass http://auth:3000/private/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /private/callback {
        proxy_pass http://auth:3000/private/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Protected resource. nginx enforces authorization here using the OAuth2
    # provider as a security middleware (auth_request); only a valid access
    # token lets the request through.
    location /private/ {
        auth_request /oauth/verify;
        error_page 401 = @login;
        error_page 403 = @login;

        proxy_pass http://auth:3000/private/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin token management. Also gated at the edge; the app additionally
    # enforces that the token belongs to the admin user.
    location /admin/ {
        auth_request /oauth/verify;
        error_page 401 = @login;
        error_page 403 = @login;

        proxy_pass http://auth:3000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unauthenticated users are sent to the client to start the code flow.
    location @login {
        return 302 /private/login;
    }

    # Root path
    location / {
        return 200 '<html style="font-family:sans-serif; text-align:center; padding:50px;"><body><h1>Welcome</h1><p>Public area.</p><a href="/private/">Enter Private Area</a> &middot; <a href="/openapi.json">OpenAPI Spec</a></body></html>';
        add_header Content-Type text/html;
    }
}
