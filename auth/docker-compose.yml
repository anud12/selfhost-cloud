services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Public URL of the auth server (scheme://host[:port]), used for
      # redirect_uri construction in the demo OAuth client flow.
      PUBLIC_URL: ${PUBLIC_URL:-https://anud.ro}
      # Trust X-Forwarded-* headers only when proxied by nginx (docker network).
      TRUST_PROXY: docker
    restart: always
